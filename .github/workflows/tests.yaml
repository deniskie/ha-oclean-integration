name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  # Lint, format and type checks are interpreter-independent – run them once.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Lint (ruff)
        run: ruff check custom_components/ tests/
      - name: Format (ruff)
        run: ruff format --check custom_components/ tests/
      - name: Type check (mypy)
        run: mypy custom_components/oclean_ble/ --ignore-missing-imports

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the project's declared target; 3.13 and 3.14 are what current
        # Home Assistant cores actually ship, so the suite must pass there too.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Run tests
        run: pytest --tb=short
